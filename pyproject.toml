[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plynth"
version = "0.1.0"
description = "Declarative project plans, materialized as GitHub Projects (and other backends)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Barry Johnston" }]
keywords = ["github", "projects", "ghes", "yaml", "declarative", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/declaratus/plynth"
Issues = "https://github.com/declaratus/plynth/issues"

[project.scripts]
plynth = "plynth.cli:main"
