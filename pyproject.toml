[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plynth"
version = "0.3.0rc1"
description = "Declarative project plans, materialized as GitHub Projects (and other backends)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Barry Johnston" }]
keywords = ["github", "projects", "ghes", "yaml", "declarative", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    'eval-type-backport>=0.2; python_version < "3.10"',
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
    "responses>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/declaratus/plynth"
Issues = "https://github.com/declaratus/plynth/issues"

[project.scripts]
plynth = "plynth.cli:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"plynth/queries/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
strict = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml", "responses"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plynth.engine.graphql_client", "plynth.engine.rest_client"]
disable_error_code = ["type-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = ["plynth.engine.phases"]
disable_error_code = ["union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
