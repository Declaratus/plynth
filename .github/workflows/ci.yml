name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy plynth

      - name: Tests (pytest)
        run: pytest -q

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # `local: true` audits the project's runtime dependencies as
      # declared in pyproject.toml -- not the [dev] extras (pytest/
      # ruff/mypy/responses) which never ship to users. The action
      # manages pip-audit in its own venv so its tooling deps don't
      # pollute the scanned set. Fails on any reported vulnerability;
      # to suppress a specific advisory, see the `ignore-vulns` input
      # documented in CONTRIBUTING.md.
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          local: true
          # Both CVEs are in pip itself (the runner's installed package
          # manager bootstrap, not a plynth runtime dependency). Drop an
          # entry once GitHub-hosted runners ship a new enough pip:
          #   CVE-2026-3219: no upstream fix at time of pin.
          #   CVE-2026-6357: fixed in pip 26.1; runner ships 26.0.1.
          ignore-vulns: |
            CVE-2026-3219
            CVE-2026-6357

  # Single aggregate check that the org-level branch ruleset can require
  # by name. `if: always()` is load-bearing: without it, a failed/skipped
  # upstream job leaves this one "skipped", which counts as a pass on a
  # required check. Explicit per-need result comparison rather than
  # `contains(needs.*.result, 'failure')` so cancelled or skipped legs
  # also fail the gate. See Declaratus/governance spec 01 risk #3 and
  # RUNBOOKS/ruleset-rollout.md § Status checks.
  ci-summary:
    name: ci-summary
    needs: [test, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          test_result='${{ needs.test.result }}'
          audit_result='${{ needs.audit.result }}'
          echo "test=$test_result audit=$audit_result"
          if [ "$test_result" != "success" ] || [ "$audit_result" != "success" ]; then
            exit 1
          fi
