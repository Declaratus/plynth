name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Check the build has the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib

          from packaging.version import Version

          tag = Version(os.environ["TAG"].removeprefix("v"))
          for wheel in pathlib.Path("dist").glob("*.whl"):
              built = Version(wheel.name.split("-")[1])
              if built != tag:
                  raise SystemExit(f"{wheel.name} is version {built}, but the tag is {tag}")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plynth
    permissions:
      id-token: write  # OIDC for Trusted Publishing — no API token required.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Publish the GitHub Release
    # Only after PyPI has the release, so a failed upload leaves the draft unpublished.
    needs: [build, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            # release-please made a draft with the changelog entry as notes.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false
          else
            # A tag pushed by hand, such as a release candidate.
            pre=""
            case "$TAG" in *-*) pre="--prerelease" ;; esac
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes $pre
          fi
